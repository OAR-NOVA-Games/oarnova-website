name: Release artifact

# Manual, owner-triggered. Builds the static site from a tag, verifies it, and attaches
# the immutable artifact to a draft GitHub Release. It never deploys: promotion to the
# studio server happens through oarnova-infrastructure (docs/INFRA-HANDOFF.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run check:assets
      - run: npm run generate && npm run check:dist
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: npm run artifact
      - name: Create draft release with the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" artifacts/* --draft --verify-tag \
            --title "oarnova-website $TAG" \
            --notes "Static site artifact. Checksums: see the .json and .SHA256SUMS files. Not deployed."
