name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  quality:
    name: Lint, types, unit tests, asset integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:assets

  build:
    name: Static build and artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run check:dist
      - run: npm run artifact
      - name: Reproducibility (second clean build must be byte-identical)
        run: |
          first=$(jq -r .archiveSha256 artifacts/*.json)
          mkdir -p /tmp/first && cp artifacts/* /tmp/first/
          rm -rf .output .nuxt artifacts
          npm run generate
          npm run artifact
          second=$(jq -r .archiveSha256 artifacts/*.json)
          echo "first=$first second=$second"
          if [ "$first" != "$second" ]; then
            diff <(cat /tmp/first/*.SHA256SUMS) <(cat artifacts/*.SHA256SUMS) || true
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .output/public
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact
          path: artifacts/
          retention-days: 30

  e2e:
    name: Playwright E2E (real GSAP, a11y, EN/FA, 3 viewports)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .output/public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Review screenshots (EN/FA, desktop/tablet/mobile)
        run: npx playwright test --config tests/visual/playwright.visual.config.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/screenshots/
          retention-days: 14

  caddy:
    name: Smoke test on the production Caddy image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Run Caddy with the proposed studio Caddyfile
        run: |
          # Same image digest as production. ECR Public rate-limits anonymous pulls, so fall
          # back to Docker Hub's official image; the digest pin guarantees identical content.
          digest=sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          image=""
          for ref in public.ecr.aws/docker/library/caddy@$digest docker.io/library/caddy@$digest; do
            for i in 1 2 3; do docker pull -q "$ref" && image=$ref && break 2; sleep 5; done
          done
          [ -n "$image" ] || { echo "could not pull caddy@$digest"; exit 1; }
          docker run -d --name studio -p 8080:8080 --read-only --user 10001:10001 \
            --tmpfs /data --tmpfs /config \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/site:/srv:ro" \
            "$image" caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - run: bash scripts/smoke.sh http://127.0.0.1:8080
      - if: failure()
        run: docker logs studio

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Blocking at critical. High advisories are reviewed in docs/SECURITY.md: as of 2026-10-17 the
      # only ones (braces, node-forge) sit in Nuxt's build/dev tooling, have no patched release and
      # are absent from the static output.
      - name: npm audit (blocking at critical)
        run: npm audit --audit-level=critical
      - name: npm audit (full report)
        run: npm audit || true
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
